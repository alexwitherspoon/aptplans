name: Intake ack

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  ack:
    if: contains(join(github.event.issue.labels.*.name, ','), 'intake')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                'Queued as a hint for the fetch worker. Opening or closing this issue does not publish a document or mark it complete. Official URLs stay the citation of record.',
                '',
                'If the worker can resolve this from the form fields, it comments and closes the issue. If a human is needed, it mentions @alexwitherspoon and leaves the issue open.'
              ].join('\n')
            })
