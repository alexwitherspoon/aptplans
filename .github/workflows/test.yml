name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: make ci
      - name: Build self-hosted OCR worker
        run: docker build -f docker/Dockerfile.worker -t aptplans-worker .
      - name: Brookings image-only OCR benchmark
        timeout-minutes: 5
        run: docker run --rm aptplans-worker python3 -m pipeline.ocr_benchmark
      - name: Oregon clean-cutover benchmark
        timeout-minutes: 15
        env:
          OREGON_BENCHMARK_REPORT: /tmp/oregon-benchmark.json
        run: make oregon-benchmark
