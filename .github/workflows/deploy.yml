name: Deploy

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for this deploy
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: make test

  deploy:
    runs-on: ubuntu-latest
    needs: [verify]
    if: |
      always() &&
      (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && needs.verify.result == 'success')
      )
    timeout-minutes: 90
    env:
      DEPLOY_USER: ${{ secrets.USER }}
      DEPLOY_HOST: ${{ secrets.HOST }}
    steps:
      - name: Require deploy secrets
        run: |
          if [ -z "${DEPLOY_USER}" ] || [ -z "${DEPLOY_HOST}" ]; then
            echo "Set repository secrets USER and HOST (and SSH_PRIVATE_KEY)."
            exit 1
          fi
          if [ "${DEPLOY_USER}" != "aptplans" ]; then
            echo "USER must be aptplans; sshd AllowUsers rejects root and the image debian account."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static site
        run: |
          pip install -e .
          make site

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Install rsync on origin
        run: |
          ssh -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'EOF'
          set -euo pipefail
          if command -v rsync >/dev/null; then
            exit 0
          fi
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y rsync
          EOF

      - name: Sync repository
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<EOF
          set -euo pipefail
          sudo mkdir -p /opt/aptplans /var/lib/aptplans/site /var/lib/aptplans/tls
          sudo chown -R "${DEPLOY_USER}:${DEPLOY_USER}" /opt/aptplans /var/lib/aptplans/site /var/lib/aptplans/tls
          EOF
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.venv/' \
            --exclude 'dist/' \
            --exclude '__pycache__/' \
            --exclude '*.egg-info/' \
            --exclude '.pytest_cache/' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/aptplans/"
          rsync -az --delete dist/ "${DEPLOY_USER}@${DEPLOY_HOST}:/var/lib/aptplans/site/"

      - name: Install origin TLS material
        env:
          ORIGIN_CERT: ${{ secrets.CLOUDFLARE_ORIGIN_CERT }}
          ORIGIN_KEY: ${{ secrets.CLOUDFLARE_ORIGIN_KEY }}
        run: |
          if [ -z "${ORIGIN_CERT}" ] || [ -z "${ORIGIN_KEY}" ]; then
            echo "no CLOUDFLARE_ORIGIN_CERT/KEY secrets; bootstrap will keep or create a self-signed origin cert"
            exit 0
          fi
          umask 077
          printf '%s\n' "${ORIGIN_CERT}" > /tmp/origin.pem
          printf '%s\n' "${ORIGIN_KEY}" > /tmp/origin.key
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo mkdir -p /var/lib/aptplans/tls'
          scp /tmp/origin.pem /tmp/origin.key "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo mv /tmp/origin.pem /tmp/origin.key /var/lib/aptplans/tls/; sudo chmod 644 /var/lib/aptplans/tls/origin.pem; sudo chmod 600 /var/lib/aptplans/tls/origin.key'
          rm -f /tmp/origin.pem /tmp/origin.key
          echo "installed Cloudflare Origin CA material"

      - name: Install worker secrets
        env:
          PIA_SOCKS_USER: ${{ secrets.PIA_SOCKS_USER }}
          PIA_SOCKS_PASSWORD: ${{ secrets.PIA_SOCKS_PASSWORD }}
          PIA_SOCKS_HOST: ${{ secrets.PIA_SOCKS_HOST }}
          PIA_SOCKS_PORT: ${{ secrets.PIA_SOCKS_PORT }}
          INTAKE_GITHUB_TOKEN: ${{ secrets.INTAKE_GITHUB_TOKEN }}
          INTAKE_GITHUB_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import quote

          lines = [
              "# Written by GitHub Actions Deploy. Do not commit.",
              f"INTAKE_GITHUB_REPO={os.environ.get('INTAKE_GITHUB_REPO', '').strip()}",
          ]
          token = os.environ.get("INTAKE_GITHUB_TOKEN", "").strip()
          if token:
              lines.append(f"INTAKE_GITHUB_TOKEN={token}")
          user = os.environ.get("PIA_SOCKS_USER", "").strip()
          password = os.environ.get("PIA_SOCKS_PASSWORD", "").strip()
          host = os.environ.get("PIA_SOCKS_HOST", "").strip() or (
              "proxy-nl.privateinternetaccess.com"
          )
          port = os.environ.get("PIA_SOCKS_PORT", "").strip() or "1080"
          if user and password:
              lines.append(
                  "APTPLANS_FETCH_PROXY=socks5h://"
                  f"{quote(user, safe='')}:{quote(password, safe='')}@{host}:{port}"
              )
          path = Path("/tmp/aptplans.env.secrets")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          path.chmod(0o600)
          PY
          scp /tmp/aptplans.env.secrets "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/aptplans.env.secrets"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'EOF'
          set -euo pipefail
          sudo mkdir -p /home/aptplans
          sudo mv /tmp/aptplans.env.secrets /home/aptplans/.env.secrets
          sudo chown aptplans:aptplans /home/aptplans/.env.secrets
          sudo chmod 600 /home/aptplans/.env.secrets
          EOF
          rm -f /tmp/aptplans.env.secrets
          if [ -n "${PIA_SOCKS_USER}" ] && [ -n "${PIA_SOCKS_PASSWORD}" ]; then
            echo "PIA SOCKS proxy: set"
          else
            echo "PIA SOCKS proxy: unset"
          fi
          if [ -n "${INTAKE_GITHUB_TOKEN}" ]; then
            echo "intake GitHub token: set"
          else
            echo "intake GitHub token: unset"
          fi

      - name: Bootstrap host and start Caddy
        run: |
          ssh -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'EOF'
          set -euo pipefail
          chmod +x /opt/aptplans/scripts/host/*.sh /opt/aptplans/scripts/docker-cleanup-weekly.sh
          sudo /opt/aptplans/scripts/host/remote-deploy.sh
          EOF

      - name: Smoke check from runner
        run: |
          curl -fsS -o /dev/null --retry 5 --retry-delay 3 "http://${DEPLOY_HOST}/" \
            || curl -kfsS -o /dev/null --retry 5 --retry-delay 3 "https://${DEPLOY_HOST}/"
