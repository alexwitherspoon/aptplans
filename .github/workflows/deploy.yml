name: Deploy

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for this deploy
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: make ci

  deploy:
    runs-on: ubuntu-latest
    needs: [verify]
    if: |
      always() &&
      (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && needs.verify.result == 'success')
      )
    timeout-minutes: 30
    env:
      DEPLOY_USER: ${{ secrets.USER }}
      DEPLOY_HOST: ${{ secrets.HOST }}
      DEPLOY_SSH_OPTS: "-o ServerAliveInterval=30 -o ServerAliveCountMax=60"
    steps:
      - name: Require deploy secrets
        run: |
          if [ -z "${DEPLOY_USER}" ] || [ -z "${DEPLOY_HOST}" ]; then
            echo "Set repository secrets USER and HOST (and SSH_PRIVATE_KEY)."
            exit 1
          fi
          if [ "${DEPLOY_USER}" != "aptplans" ]; then
            echo "USER must be aptplans; sshd AllowUsers rejects root and the image debian account."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Install rsync on origin
        run: |
          ssh ${DEPLOY_SSH_OPTS} -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'EOF'
          set -euo pipefail
          if command -v rsync >/dev/null; then
            exit 0
          fi
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y rsync
          EOF

      - name: Sync repository
        run: |
          ssh ${DEPLOY_SSH_OPTS} "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<EOF
          set -euo pipefail
          sudo mkdir -p /opt/aptplans /var/lib/aptplans/site /var/lib/aptplans/tls
          sudo chown -R "${DEPLOY_USER}:${DEPLOY_USER}" /opt/aptplans /var/lib/aptplans/site /var/lib/aptplans/tls
          EOF
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.venv/' \
            --exclude 'dist/' \
            --exclude '__pycache__/' \
            --exclude '*.egg-info/' \
            --exclude '.pytest_cache/' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/aptplans/"

      - name: Install origin TLS material
        env:
          ORIGIN_CERT: ${{ secrets.CLOUDFLARE_ORIGIN_CERT }}
          ORIGIN_KEY: ${{ secrets.CLOUDFLARE_ORIGIN_KEY }}
        run: |
          if [ -z "${ORIGIN_CERT}" ] || [ -z "${ORIGIN_KEY}" ]; then
            echo "no CLOUDFLARE_ORIGIN_CERT/KEY secrets; bootstrap will keep or create a self-signed origin cert"
            exit 0
          fi
          umask 077
          printf '%s\n' "${ORIGIN_CERT}" > /tmp/origin.pem
          printf '%s\n' "${ORIGIN_KEY}" > /tmp/origin.key
          ssh ${DEPLOY_SSH_OPTS} "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo mkdir -p /var/lib/aptplans/tls'
          scp ${DEPLOY_SSH_OPTS} /tmp/origin.pem /tmp/origin.key "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/"
          ssh ${DEPLOY_SSH_OPTS} "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo mv /tmp/origin.pem /tmp/origin.key /var/lib/aptplans/tls/; sudo chmod 644 /var/lib/aptplans/tls/origin.pem; sudo chmod 600 /var/lib/aptplans/tls/origin.key'
          rm -f /tmp/origin.pem /tmp/origin.key
          echo "installed Cloudflare Origin CA material"

      - name: Install worker secrets
        env:
          PIA_OPENVPN_USER: ${{ secrets.PIA_OPENVPN_USER }}
          PIA_OPENVPN_PASSWORD: ${{ secrets.PIA_OPENVPN_PASSWORD }}
          PIA_SERVER_REGIONS: ${{ secrets.PIA_SERVER_REGIONS }}
          INTAKE_GITHUB_TOKEN: ${{ secrets.INTAKE_GITHUB_TOKEN }}
          INTAKE_GITHUB_REPO: ${{ github.repository }}
          APTPLANS_REVIEW_TOKEN: ${{ secrets.APTPLANS_REVIEW_TOKEN }}
          APTPLANS_SEARCH_KEY: ${{ secrets.APTPLANS_SEARCH_KEY }}
          APTPLANS_GEMINI_KEY: ${{ secrets.APTPLANS_GEMINI_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          def env_line(key: str, value: str) -> str:
              text = (value or "").strip()
              if not text:
                  return ""
              escaped = text.replace("\\", "\\\\").replace('"', '\\"')
              return f'{key}="{escaped}"'

          lines = [
              "# Written by GitHub Actions Deploy. Do not commit.",
              env_line("INTAKE_GITHUB_REPO", os.environ.get("INTAKE_GITHUB_REPO", "")),
          ]
          token = os.environ.get("INTAKE_GITHUB_TOKEN", "").strip()
          if token:
              lines.append(env_line("INTAKE_GITHUB_TOKEN", token))
          review = os.environ.get("APTPLANS_REVIEW_TOKEN", "").strip()
          if review:
              lines.append(env_line("APTPLANS_REVIEW_TOKEN", review))
          search_key = os.environ.get("APTPLANS_SEARCH_KEY", "").strip()
          if search_key:
              lines.append(env_line("APTPLANS_SEARCH_KEY", search_key))
              lines.append("APTPLANS_SEARCH_PROVIDER=brave")
          gemini = os.environ.get("APTPLANS_GEMINI_KEY", "").strip()
          if gemini:
              lines.append(env_line("APTPLANS_GEMINI_KEY", gemini))
          vpn_user = os.environ.get("PIA_OPENVPN_USER", "").strip()
          vpn_password = os.environ.get("PIA_OPENVPN_PASSWORD", "").strip()
          vpn_regions = os.environ.get("PIA_SERVER_REGIONS", "").strip() or "US East"
          if vpn_user and vpn_password:
              lines.append(env_line("PIA_OPENVPN_USER", vpn_user))
              lines.append(env_line("PIA_OPENVPN_PASSWORD", vpn_password))
              lines.append(env_line("PIA_SERVER_REGIONS", vpn_regions))
          path = Path("/tmp/aptplans.env.secrets")
          path.write_text("\n".join(line for line in lines if line) + "\n", encoding="utf-8")
          path.chmod(0o600)
          PY
          scp ${DEPLOY_SSH_OPTS} /tmp/aptplans.env.secrets "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/aptplans.env.secrets"
          ssh ${DEPLOY_SSH_OPTS} "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'EOF'
          set -euo pipefail
          sudo mkdir -p /home/aptplans
          sudo mv /tmp/aptplans.env.secrets /home/aptplans/.env.secrets
          sudo chown aptplans:aptplans /home/aptplans/.env.secrets
          sudo chmod 600 /home/aptplans/.env.secrets
          EOF
          rm -f /tmp/aptplans.env.secrets
          if [ -n "${PIA_OPENVPN_USER}" ] && [ -n "${PIA_OPENVPN_PASSWORD}" ]; then
            echo "PIA VPN egress: set"
          else
            echo "PIA VPN egress: unset"
          fi
          if [ -n "${INTAKE_GITHUB_TOKEN}" ]; then
            echo "intake GitHub token: set"
          else
            echo "intake GitHub token: unset"
          fi
          if [ -n "${APTPLANS_REVIEW_TOKEN}" ]; then
            echo "review API token: set"
          else
            echo "review API token: unset"
          fi
          if [ -n "${APTPLANS_SEARCH_KEY}" ]; then
            echo "Brave search key: set"
          else
            echo "Brave search key: unset"
          fi
          if [ -n "${APTPLANS_GEMINI_KEY}" ]; then
            echo "Gemini search key: set"
          else
            echo "Gemini search key: unset"
          fi

      - name: Bootstrap host and start Caddy
        run: |
          ssh ${DEPLOY_SSH_OPTS} -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'EOF'
          set -euo pipefail
          sudo /opt/aptplans/scripts/host/remote-deploy.sh
          EOF

      - name: Smoke check from runner
        run: |
          curl -fsS -o /dev/null --retry 5 --retry-delay 3 "http://${DEPLOY_HOST}/" \
            || curl -kfsS -o /dev/null --retry 5 --retry-delay 3 "https://${DEPLOY_HOST}/"
