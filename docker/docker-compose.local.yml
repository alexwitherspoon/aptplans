services:
  site:
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ../dist:/srv/releases/current/site:ro
      - ${PUBLIC_FILES_PATH:-../data/public-files}:/srv/releases/current/public-files:ro
    environment:
      - APP_ENV=local
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-aptplanslocalkey1}

  search:
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-aptplanslocalkey1}
    volumes:
      - ${SEARCH_PATH:-../data/search}:/meili_data

  worker:
    environment:
      - APP_ENV=local
      - APTPLANS_FILES=/var/lib/aptplans/files
      - APTPLANS_PUBLIC_FILES=/var/lib/aptplans/public-files
      - APTPLANS_QUEUE=/var/lib/aptplans/queue
      - APTPLANS_CATALOG_OVERLAY=/var/lib/aptplans/catalog
      - APTPLANS_TEXT=/var/lib/aptplans/text
      - APTPLANS_REJECT=/var/lib/aptplans/reject
      - APTPLANS_LOGS=/var/lib/aptplans/logs
      - OLLAMA_HOST=http://ollama:11434
      - MEILI_URL=http://search:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-aptplanslocalkey1}
      # Laptop stack: no live FAA refresh, no LLM.

  review:
    image: aptplans-worker
    working_dir: /app
    command: ["python3", "-m", "pipeline.review_api"]
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ..:/app
      - ${FILES_PATH:-../data/files}:/var/lib/aptplans/files:ro
      - ${CATALOG_OVERLAY_PATH:-../data/catalog}:/var/lib/aptplans/catalog
      - ${REJECT_PATH:-../data/reject}:/var/lib/aptplans/reject
      - ${QUEUE_PATH:-../data/queue}:/var/lib/aptplans/queue
      - ${LOGS_PATH:-../data/logs}:/var/lib/aptplans/logs:ro
    environment:
      - APP_ENV=local
      - APTPLANS_FILES=/var/lib/aptplans/files
      - APTPLANS_CATALOG_OVERLAY=/var/lib/aptplans/catalog
      - APTPLANS_REJECT=/var/lib/aptplans/reject
      - APTPLANS_QUEUE=/var/lib/aptplans/queue
      - APTPLANS_LOGS=/var/lib/aptplans/logs
      - APTPLANS_REVIEW_BIND=0.0.0.0:8787
      - APTPLANS_REVIEW_TOKEN=${APTPLANS_REVIEW_TOKEN:-dev-review-token}
      - APTPLANS_REVIEW_PUBLIC=1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  ollama:
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - default
      - llm
    volumes:
      - ${MODELS_PATH:-../data/models}:/models:ro
