name: aptplans

# One stack: static site (Caddy), Meilisearch, serial worker, CPU Ollama.
# Ollama has no host ports. It is only on the internal `llm` network.
# Search has no host ports. Caddy proxies POST /search/query.
# The worker drains the SQLite job ledger with concurrency 1. Local `make up` starts
# `site` only. `make stack` starts the full stack with gitignored data/
# binds and without live FAA refresh or LLM. Origin CD starts the full
# stack with APTPLANS_REFRESH_AIRPORTS=1 and APTPLANS_LLM=1.

networks:
  llm:
    name: aptplans_llm
    internal: true

volumes:
  ollama_data:
  models_data:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  site:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: aptplans-site
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-}
    logging: *default-logging

  search:
    image: getmeili/meilisearch:v1.11.3
    restart: unless-stopped
    environment:
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-}
    volumes:
      - ${SEARCH_PATH:-/var/lib/aptplans/search}:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    image: aptplans-worker
    restart: unless-stopped
    working_dir: /app
    networks:
      - default
      - llm
    depends_on:
      ollama:
        condition: service_healthy
        required: false
      search:
        condition: service_started
        required: false
    volumes:
      - ..:/app
      - ${FILES_PATH:-/var/lib/aptplans/files}:/var/lib/aptplans/files
      - ${PUBLIC_FILES_PATH:-/var/lib/aptplans/public-files}:/var/lib/aptplans/public-files
      - ${QUEUE_PATH:-/var/lib/aptplans/queue}:/var/lib/aptplans/queue
      - ${CONTROL_PATH:-/var/lib/aptplans/control}:/var/lib/aptplans/control
      - ${CATALOG_OVERLAY_PATH:-/var/lib/aptplans/catalog}:/var/lib/aptplans/catalog
      - ${TEXT_PATH:-/var/lib/aptplans/text}:/var/lib/aptplans/text
      - ${EXTRACTIONS_PATH:-/var/lib/aptplans/extractions}:/var/lib/aptplans/extractions
      - ${REJECT_PATH:-/var/lib/aptplans/reject}:/var/lib/aptplans/reject
      - ${LOGS_PATH:-/var/lib/aptplans/logs}:/var/lib/aptplans/logs
    environment:
      - APTPLANS_FILES=/var/lib/aptplans/files
      - APTPLANS_PUBLIC_FILES=/var/lib/aptplans/public-files
      - APTPLANS_QUEUE=/var/lib/aptplans/queue
      - APTPLANS_CONTROL_QUEUE=/var/lib/aptplans/control
      - APTPLANS_CATALOG_OVERLAY=/var/lib/aptplans/catalog
      - APTPLANS_TEXT=/var/lib/aptplans/text
      - APTPLANS_EXTRACTIONS=/var/lib/aptplans/extractions
      - APTPLANS_OCR=${APTPLANS_OCR:-0}
      - APTPLANS_REJECT=/var/lib/aptplans/reject
      - APTPLANS_LOGS=/var/lib/aptplans/logs
      - APTPLANS_USER_AGENT=${APTPLANS_USER_AGENT:-aptplans.org}
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-bonsai-27b}
      - APTPLANS_FETCH_PROXY=${APTPLANS_FETCH_PROXY:-}
      - INTAKE_GITHUB_TOKEN=${INTAKE_GITHUB_TOKEN:-}
      - INTAKE_GITHUB_REPO=${INTAKE_GITHUB_REPO:-}
      - APTPLANS_SEARCH_KEY=${APTPLANS_SEARCH_KEY:-}
      - APTPLANS_SEARCH_PROVIDER=${APTPLANS_SEARCH_PROVIDER:-brave}
      - APTPLANS_GEMINI_KEY=${APTPLANS_GEMINI_KEY:-}
      - APTPLANS_SEARCH_MONTHLY_CAP=${APTPLANS_SEARCH_MONTHLY_CAP:-}
      - APTPLANS_BRAVE_MONTHLY_BUDGET_USD=${APTPLANS_BRAVE_MONTHLY_BUDGET_USD:-25}
      - APTPLANS_GEMINI_MONTHLY_BUDGET_USD=${APTPLANS_GEMINI_MONTHLY_BUDGET_USD:-25}
      - APTPLANS_GEMINI_MONTHLY_CAP=${APTPLANS_GEMINI_MONTHLY_CAP:-}
      - APTPLANS_SEARCH_STATES=${APTPLANS_SEARCH_STATES:-OR}
      - MEILI_URL=http://search:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-}
    logging: *default-logging

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    networks:
      - llm
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NO_CLOUD=1
      - OLLAMA_GPU_DRIVER=cpu
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_QUEUE=8
      - OLLAMA_CONTEXT_LENGTH=32768
      - OLLAMA_LOAD_TIMEOUT=20m
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - ollama_data:/root/.ollama
      - models_data:/models:ro
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s
    logging: *default-logging
