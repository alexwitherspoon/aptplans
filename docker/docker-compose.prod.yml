services:
  site:
    ports:
      - "80:80"
      - "443:443"
    # NUMA node 0 (4 cores / 8 threads). Leaves nodes 1-3 for Ollama.
    cpuset: ${SITE_CPUSET:-0-3,16-19}
    volumes:
      # Keep files off the site mount. A nested bind under /srv/site:ro fails
      # because Docker cannot mkdir the mountpoint on a read-only volume.
      - ${SITE_PATH:-/var/lib/aptplans/site}:/srv/site:ro
      - ${FILES_PATH:-/var/lib/aptplans/files}:/srv/files:ro
      - ${TLS_PATH:-/var/lib/aptplans/tls}:/certs:ro
      - ${REPO_PATH:-/opt/aptplans}/docker/Caddyfile.prod:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3

  worker:
    depends_on:
      ollama:
        condition: service_healthy
        required: true
    cpuset: ${WORKER_CPUSET:-0-3,16-19}
    volumes:
      - ${REPO_PATH:-/opt/aptplans}:/app
      - ${FILES_PATH:-/var/lib/aptplans/files}:/var/lib/aptplans/files
      - ${QUEUE_PATH:-/var/lib/aptplans/queue}:/var/lib/aptplans/queue
      - ${CATALOG_OVERLAY_PATH:-/var/lib/aptplans/catalog}:/var/lib/aptplans/catalog
      - ${SITE_PATH:-/var/lib/aptplans/site}:/var/lib/aptplans/site
    environment:
      - APP_ENV=production
      - APTPLANS_FILES=/var/lib/aptplans/files
      - APTPLANS_QUEUE=/var/lib/aptplans/queue
      - APTPLANS_CATALOG_OVERLAY=/var/lib/aptplans/catalog
      - APTPLANS_SITE=/var/lib/aptplans/site
      - APTPLANS_USER_AGENT=aptplans.org
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=bonsai-27b
      - APTPLANS_FETCH_PROXY=${APTPLANS_FETCH_PROXY:-}
      - INTAKE_GITHUB_TOKEN=${INTAKE_GITHUB_TOKEN:-}
      - INTAKE_GITHUB_REPO=${INTAKE_GITHUB_REPO:-}
      - APTPLANS_REFRESH_AIRPORTS=1
      - APTPLANS_LLM=1

  ollama:
    # NUMA nodes 1-3: physical cores 4-15 plus SMT siblings (24 threads).
    cpuset: ${OLLAMA_CPUSET:-4-15,20-31}
    volumes:
      - ${OLLAMA_PATH:-/var/lib/aptplans/ollama}:/root/.ollama
      - ${MODELS_PATH:-/var/lib/aptplans/models}:/models:ro
