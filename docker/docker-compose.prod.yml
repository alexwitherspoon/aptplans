services:
  site:
    ports:
      - "80:80"
      - "443:443"
    # NUMA node 0 (4 cores / 8 threads). Leaves nodes 1-3 for Ollama.
    cpuset: ${SITE_CPUSET:-0-3,16-19}
    volumes:
      # Mount the release root so Caddy follows the atomic `current` symlink
      # on every request instead of pinning one bind-mounted generation.
      - ${RELEASES_PATH:-/var/lib/aptplans/releases}:/srv/releases:ro
      - ${TLS_PATH:-/var/lib/aptplans/tls}:/certs:ro
      - ${REPO_PATH:-/opt/aptplans}/docker/Caddyfile.prod:/etc/caddy/Caddyfile:ro
    environment:
      - APP_ENV=production
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-}
    depends_on:
      - review
    healthcheck:
      test: ["CMD", "curl", "-kfsS", "https://127.0.0.1/review/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  search:
    cpuset: ${SEARCH_CPUSET:-0-3,16-19}
    volumes:
      - ${SEARCH_PATH:-/var/lib/aptplans/search}:/meili_data

  worker:
    depends_on:
      egress:
        condition: service_healthy
        required: true
      ollama:
        condition: service_healthy
        required: true
    cpuset: ${WORKER_CPUSET:-0-3,16-19}
    volumes:
      - ${REPO_PATH:-/opt/aptplans}:/app
      - ${FILES_PATH:-/var/lib/aptplans/files}:/var/lib/aptplans/files
      - ${PUBLIC_FILES_PATH:-/var/lib/aptplans/public-files}:/var/lib/aptplans/public-files
      - ${QUEUE_PATH:-/var/lib/aptplans/queue}:/var/lib/aptplans/queue
      - ${CONTROL_PATH:-/var/lib/aptplans/control}:/var/lib/aptplans/control
      - ${CATALOG_OVERLAY_PATH:-/var/lib/aptplans/catalog}:/var/lib/aptplans/catalog
      - ${TEXT_PATH:-/var/lib/aptplans/text}:/var/lib/aptplans/text
      - ${EXTRACTIONS_PATH:-/var/lib/aptplans/extractions}:/var/lib/aptplans/extractions
      - ${REJECT_PATH:-/var/lib/aptplans/reject}:/var/lib/aptplans/reject
      - ${RELEASES_PATH:-/var/lib/aptplans/releases}:/var/lib/aptplans/releases
      - ${LOGS_PATH:-/var/lib/aptplans/logs}:/var/lib/aptplans/logs
    environment:
      - APP_ENV=production
      - APTPLANS_DEV_PREVIEW=0
      - APTPLANS_REFERENCE_SEED=0
      - APTPLANS_FILES=/var/lib/aptplans/files
      - APTPLANS_PUBLIC_FILES=/var/lib/aptplans/public-files
      - APTPLANS_QUEUE=/var/lib/aptplans/queue
      - APTPLANS_CONTROL_QUEUE=/var/lib/aptplans/control
      - APTPLANS_DOMAIN_STORE=1
      - APTPLANS_CATALOG_OVERLAY=/var/lib/aptplans/catalog
      - APTPLANS_TEXT=/var/lib/aptplans/text
      - APTPLANS_EXTRACTIONS=/var/lib/aptplans/extractions
      - APTPLANS_OCR=${APTPLANS_OCR:-1}
      - APTPLANS_REJECT=/var/lib/aptplans/reject
      - APTPLANS_LOGS=/var/lib/aptplans/logs
      - APTPLANS_SITE=/var/lib/aptplans/releases/current/site
      - APTPLANS_PUBLIC_FILES=/var/lib/aptplans/releases/current/public-files
      - APTPLANS_RELEASES=/var/lib/aptplans/releases
      - APTPLANS_USER_AGENT=aptplans.org
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=bonsai-27b
      - APTPLANS_FETCH_PROXY=http://egress:8888
      - INTAKE_GITHUB_TOKEN=${INTAKE_GITHUB_TOKEN:-}
      - INTAKE_GITHUB_REPO=${INTAKE_GITHUB_REPO:-}
      - APTPLANS_SEARCH_KEY=${APTPLANS_SEARCH_KEY:-}
      - APTPLANS_SEARCH_PROVIDER=${APTPLANS_SEARCH_PROVIDER:-brave}
      - APTPLANS_GEMINI_KEY=${APTPLANS_GEMINI_KEY:-}
      - APTPLANS_SEARCH_MONTHLY_CAP=${APTPLANS_SEARCH_MONTHLY_CAP:-}
      - APTPLANS_BRAVE_MONTHLY_BUDGET_USD=${APTPLANS_BRAVE_MONTHLY_BUDGET_USD:-25}
      - APTPLANS_GEMINI_MONTHLY_BUDGET_USD=${APTPLANS_GEMINI_MONTHLY_BUDGET_USD:-25}
      - APTPLANS_GEMINI_MONTHLY_CAP=${APTPLANS_GEMINI_MONTHLY_CAP:-}
      - APTPLANS_SEARCH_STATES=${APTPLANS_SEARCH_STATES:-OR}
      - APTPLANS_REFRESH_AIRPORTS=1
      - APTPLANS_LLM=1
      - MEILI_URL=http://search:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-}

  review:
    image: aptplans-worker
    working_dir: /app
    command: ["python3", "-m", "pipeline.review_api"]
    cpuset: ${WORKER_CPUSET:-0-3,16-19}
    volumes:
      - ${REPO_PATH:-/opt/aptplans}:/app
      - ${FILES_PATH:-/var/lib/aptplans/files}:/var/lib/aptplans/files:ro
      - ${CATALOG_OVERLAY_PATH:-/var/lib/aptplans/catalog}:/var/lib/aptplans/catalog
      - ${REJECT_PATH:-/var/lib/aptplans/reject}:/var/lib/aptplans/reject
      - ${QUEUE_PATH:-/var/lib/aptplans/queue}:/var/lib/aptplans/queue:ro
      - ${CONTROL_PATH:-/var/lib/aptplans/control}:/var/lib/aptplans/control
      - ${LOGS_PATH:-/var/lib/aptplans/logs}:/var/lib/aptplans/logs:ro
    environment:
      - APP_ENV=production
      - APTPLANS_FILES=/var/lib/aptplans/files
      - APTPLANS_CATALOG_OVERLAY=/var/lib/aptplans/catalog
      - APTPLANS_REJECT=/var/lib/aptplans/reject
      - APTPLANS_QUEUE=/var/lib/aptplans/queue
      - APTPLANS_CONTROL_QUEUE=/var/lib/aptplans/control
      - APTPLANS_DOMAIN_STORE=1
      - APTPLANS_CONTROL_WRITER=1
      - APTPLANS_JOB_LEDGER_READ_ONLY=1
      - APTPLANS_LOGS=/var/lib/aptplans/logs
      - APTPLANS_REVIEW_BIND=0.0.0.0:8787
      - APTPLANS_REVIEW_TOKEN=${APTPLANS_REVIEW_TOKEN:-}
      - APTPLANS_REVIEW_PUBLIC=1
    restart: unless-stopped
    expose:
      - "8787"

  ollama:
    # NUMA nodes 1-3: physical cores 4-15 plus SMT siblings (24 threads).
    cpuset: ${OLLAMA_CPUSET:-4-15,20-31}
    volumes:
      - ${OLLAMA_PATH:-/var/lib/aptplans/ollama}:/root/.ollama
      - ${MODELS_PATH:-/var/lib/aptplans/models}:/models:ro

  egress:
    image: qmcgaw/gluetun:v3.40.0
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    cpuset: ${WORKER_CPUSET:-0-3,16-19}
    volumes:
      - ${EGRESS_PATH:-/var/lib/aptplans/egress}:/gluetun
    environment:
      VPN_SERVICE_PROVIDER: private internet access
      VPN_TYPE: openvpn
      OPENVPN_USER: ${PIA_OPENVPN_USER:-}
      OPENVPN_PASSWORD: ${PIA_OPENVPN_PASSWORD:-}
      OPENVPN_PROTOCOL: tcp
      SERVER_REGIONS: ${PIA_SERVER_REGIONS:-US East}
      FIREWALL_OUTBOUND_SUBNETS: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
      HEALTH_TARGET_ADDRESS: 1.1.1.1:443
      HTTPPROXY: "on"
      HTTPPROXY_LOG: "off"
      HTTPPROXY_LISTENING_ADDRESS: :8888
      HEALTH_VPN_DURATION_INITIAL: 90s
    expose:
      - "8888"
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
