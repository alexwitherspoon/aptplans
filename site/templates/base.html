<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AptPlans{% endblock %}</title>
  <meta name="description" content="{% block description %}US airport master plans, Airport Layout Plans, and state aviation law.{% endblock %}">
  <link rel="canonical" href="{{ canonical }}{{ canonical_path|default('/') }}">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="alternate" type="application/rss+xml" title="AptPlans" href="/feeds/all.xml">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="/">AptPlans</a>
    <nav>
      <a href="/search/">Search</a>
      <a href="/airports/">Airports</a>
      <a href="/states/">States</a>
      <a href="/about/">About</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    {% block footer_notice %}
    <p>Unofficial. Not an FAA, state, or airport publication. Not legal advice.</p>
    {% endblock %}
    <p><a href="{{ canonical }}">aptplans.org</a> · © {{ year }} · <a href="https://github.com/alexwitherspoon/aptplans">Source</a> · <a href="/feeds/all.xml">RSS</a></p>
  </footer>
</body>
</html>
