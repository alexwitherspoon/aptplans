[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aptplans"
version = "0.1.0"
description = "Public library of US airport master plans, Airport Layout Plans, and state aviation law"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "pypdf>=6.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]
worker = [
    "pysocks>=1.7.1",
]

[project.urls]
Homepage = "https://aptplans.org"
Repository = "https://github.com/alexwitherspoon/aptplans"

[tool.setuptools.packages.find]
include = ["catalog*", "pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
